spring.application.name=stream-service
server.port=8081
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-search-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ayub.assessment.stream.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.ayub.assessment.stream.event.ProductEvent
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
